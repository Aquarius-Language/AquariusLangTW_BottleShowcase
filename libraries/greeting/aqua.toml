manifest_version = 2

[library]
name = "bottle_greeting"
version = "0.19.0"
platforms = ["windows", "linux", "web", "android"]
license = "MIT"
description = "A local source/native SDK library with assets and a transitive dependency."

[native]
name = "bottle_greeting"
modules = ["BottleGreetingNative|問候原生"]
source = "native"

[[modules]]
names = "BottleGreeting|套件問候"
source = "main.aqua"

[dependencies]
bottle_numbers = { path = "dependencies/numbers/aqua.toml", version = "1.1.0" }

[[assets]]
source = "assets"
